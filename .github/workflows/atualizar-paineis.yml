# Republica os dois painéis a partir da planilha de monitoramento.
#
# Fecha o único trecho manual da cadeia:
#   Drive --(Apps Script, gatilho diário 7h)--> planilha --(ESTE workflow)--> painéis
#
# Antes disso alguém precisava rodar os geradores na mão e dar push; sem isso
# o painel congelava enquanto a planilha seguia em dia.
name: Atualizar painéis

on:
  # GATILHO PRINCIPAL — o Apps Script chama este workflow assim que termina de
  # reescrever as abas (função dispararPainel, ao fim de rotinaDiaria).
  #
  # Por que não pelo horário: o agendamento do GitHub é uma fila compartilhada e
  # atrasa qualquer horário que se peça. Medido neste repositório:
  #   - '30 10 * * *' (7h30): as sete execuções de 23 a 29/10/2026 saíram com
  #     3h33 a 6h30 de atraso, sempre depois das 11h.
  #   - três tentativas em minuto quebrado (7h23, 9h47, 11h11), de 1 a 3/11/2026:
  #     6h a 10h de atraso. A de 02/11 pedida para as 7h23 rodou às 17h25.
  # Pedir outro horário não resolve. Quem é pontual na cadeia é o Apps Script:
  # vem cumprindo 7h55 todo dia. Então é ele que avisa, em vez de o GitHub
  # tentar adivinhar quando a planilha ficou pronta.
  repository_dispatch:
    types: [planilha-pronta]

  schedule:
    # Rede de segurança, não o caminho normal: cobre o dia em que o Apps Script
    # não conseguir disparar (token vencido, falha na varredura, cota). Uma só,
    # e tarde — se o disparo funcionou, o painel já saiu de manhã.
    - cron: '11 14 * * *'   # 11h11 de Brasília

  workflow_dispatch:        # permite rodar à mão pela aba Actions

concurrency:
  group: atualizar-paineis  # nunca duas execuções escrevendo no repo ao mesmo tempo
  cancel-in-progress: false

permissions:
  contents: write           # necessário para commitar o HTML regerado

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet openpyxl

      - name: Regerar os painéis
        run: |
          python3 gerar_painel_social.py
          python3 gerar_painel_acoes.py

      - name: Publicar se algo mudou
        # ATENÇÃO: na prática este atalho nunca segura nada. O gerador grava
        # "publicado_em" com a hora da execução dentro do próprio HTML, então o
        # arquivo muda a cada rodada mesmo sem número novo, e sempre há commit.
        # Por isso a ausência de commit num dia significa que NENHUMA execução
        # terminou — não que a planilha estava sem novidade.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cobertura.html
          if git diff --cached --quiet; then
            echo "Planilha sem novidade — nada a publicar."
            exit 0
          fi
          git commit -m "Painéis atualizados automaticamente ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
          git push
