# Republica os dois painéis a partir da planilha de monitoramento.
#
# Fecha o único trecho manual da cadeia:
#   Drive --(Apps Script, gatilho diário 7h)--> planilha --(ESTE workflow)--> painéis
#
# Antes disso alguém precisava rodar os geradores na mão e dar push; sem isso
# o painel congelava enquanto a planilha seguia em dia.
name: Atualizar painéis

on:
  schedule:
    # TRÊS tentativas, não uma. O agendamento do GitHub é uma fila compartilhada:
    # a execução pode atrasar horas ou ser descartada quando o horário pedido está
    # congestionado — e hora cheia e meia hora são os piores. Com '30 10 * * *'
    # (7h30 de Brasília) as sete execuções de 23 a 29/10/2026 saíram com 3h33 a
    # 6h30 de atraso, sempre depois das 11h; o painel passava a manhã inteira com
    # o número da véspera, mesmo com a planilha pronta desde as 7h.
    #
    # Agora o minuto é quebrado (menos disputado) e há duas repescagens. Rodar de
    # novo é inofensivo: o passo "Publicar se algo mudou" só commita quando o HTML
    # muda, e a trava de concurrency impede duas execuções ao mesmo tempo.
    #
    # Nunca antes de 10:20 UTC: o Apps Script varre o Drive às 7h de Brasília e
    # precisa ter terminado de reescrever as abas.
    - cron: '23 10 * * *'   # 7h23 de Brasília — tentativa principal
    - cron: '47 12 * * *'   # 9h47 — repescagem se a primeira não saiu
    - cron: '11 14 * * *'   # 11h11 — última rede de segurança da manhã
  workflow_dispatch:        # permite rodar à mão pela aba Actions

concurrency:
  group: atualizar-paineis  # nunca duas execuções escrevendo no repo ao mesmo tempo
  cancel-in-progress: false

permissions:
  contents: write           # necessário para commitar o HTML regerado

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet openpyxl

      - name: Regerar os painéis
        run: |
          python3 gerar_painel_social.py
          python3 gerar_painel_acoes.py

      - name: Publicar se algo mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cobertura.html
          if git diff --cached --quiet; then
            echo "Planilha sem novidade — nada a publicar."
            exit 0
          fi
          git commit -m "Painéis atualizados automaticamente ($(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M'))"
          git push
